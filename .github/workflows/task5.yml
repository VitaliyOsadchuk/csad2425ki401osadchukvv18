name: Test Client Application

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Visual Studio
      uses: microsoft/setup-msbuild@v1.0
      with:
        vs-version: 'latest'

    - name: Install Google Test
      run: |
        git clone --branch release-1.11.0 https://github.com/google/googletest.git
        cd googletest
        cmake .
        cmake --build . --target install
        cd ..
        
    - name: Build tests using MSVC
      run: |
        $TEST_APP_PATH = "tests\SWtask5\SWtask5\test.cpp"
        $TEST_BUILD_OUTPUT = "Build\task5_output"
        & "$Env:ProgramFiles\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.29.30037\bin\Hostx64\x64\cl.exe" /I"$PWD\googletest\googletest\include" /EHsc "$TEST_APP_PATH" /link "$PWD\googletest\build\lib\gtest.lib" "$PWD\googletest\build\lib\gtest_main.lib" /out:"$TEST_BUILD_OUTPUT\task5.exe"

    - name: Run tests and save output to XML
      run: |
        cd Build/task5_output
        .\task5.exe --gtest_output=xml:../test_results.xml  

    - name: Upload test results as artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: Build/test_results.xml

    - name: Archive binaries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: task5_exe
        path: Build\task5_output\task5.exe
