name: Test Client Application

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y g++ cmake libgtest-dev

    - name: Install Google Test
      run: |
        # Download and build Google Test from source
        cd ~
        git clone --branch release-1.11.0 https://github.com/google/googletest.git
        cd googletest
        cmake .
        sudo cmake --build . --target install

    - name: Build tests using GCC
      run: |
        $TEST_APP_PATH = "tests/SWtask5/SWtask5/test.cpp"
        $TEST_BUILD_OUTPUT = "Build/task5_output"

        # Compile the test executable
        g++ -I"/usr/local/include" -o "$TEST_BUILD_OUTPUT/task5.exe" "$TEST_APP_PATH" -L"/usr/local/lib" -lgtest -lgtest_main -pthread

    - name: Run tests and save output to XML
      run: |
        cd Build/task5_output
        ./task5.exe --gtest_output=xml:../test_results.xml  

    - name: Upload test results as artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: Build/test_results.xml

    - name: Archive binaries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: task5_exe
        path: Build/task5_output/task5.exe
